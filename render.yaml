services:
  - type: web
    name: mindquest-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_quests && python manage.py seed_badges"
    startCommand: "gunicorn config.wsgi --log-file -"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: mindquest-db
          property: connectionString

databases:
  - name: mindquest-db
    plan: free
